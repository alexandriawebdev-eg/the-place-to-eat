<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - The Place to Eat</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen" style="
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background-color:#FFF8DC;">
        <div style="
            background-color:#FFFDF0;
            padding:40px;
            border-radius:10px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            text-align:center;
            max-width:400px;
            width:90%;">
            <h2 style="color:#8B2500; margin-bottom:20px;">Admin Login</h2>
            <h3 style="color:#D4A017; margin-bottom:30px;">The Place to Eat</h3>
            <input type="password" id="admin-password" placeholder="Enter Admin Password"
                style="width:100%; padding:12px; border:2px solid #D4A017; border-radius:5px; font-size:16px; margin-bottom:15px; background-color:#FFF8DC;">
            <button onclick="adminLogin()"
                style="width:100%; padding:12px; background-color:#8B2500; color:#FFF8DC; border:none; border-radius:5px; font-size:18px; cursor:pointer; font-weight:bold;">
                Login
            </button>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" style="display:none;">

        <div class="admin-header">
            <div>
                <h2>🍔 The Place to Eat</h2>
                <p>Admin Dashboard</p>
            </div>
            <div>
                <span id="orders-count" style="font-size:18px; font-weight:bold;"></span>
                <button onclick="adminLogout()"
                    style="margin-left:20px; padding:8px 20px; background-color:#D4A017; color:#3D1C02; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">
                    Logout
                </button>
            </div>
        </div>

        <div class="admin-container">

            <!-- Stats -->
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-bottom:30px;">
                <div style="background-color:#FFFDF0; padding:20px; border-radius:10px; text-align:center; border-left:4px solid #8B2500;">
                    <h3 style="color:#8B2500; font-size:36px;" id="stat-new">0</h3>
                    <p>New Orders</p>
                </div>
                <div style="background-color:#FFFDF0; padding:20px; border-radius:10px; text-align:center; border-left:4px solid #F57F17;">
                    <h3 style="color:#F57F17; font-size:36px;" id="stat-preparing">0</h3>
                    <p>Preparing</p>
                </div>
                <div style="background-color:#FFFDF0; padding:20px; border-radius:10px; text-align:center; border-left:4px solid #2E7D32;">
                    <h3 style="color:#2E7D32; font-size:36px;" id="stat-delivery">0</h3>
                    <p>Out for Delivery</p>
                </div>
                <div style="background-color:#FFFDF0; padding:20px; border-radius:10px; text-align:center; border-left:4px solid #6A1B9A;">
                    <h3 style="color:#6A1B9A; font-size:36px;" id="stat-delivered">0</h3>
                    <p>Delivered</p>
                </div>
            </div>

            <!-- Filter -->
            <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
                <button onclick="filterOrders('all')" class="update-status-btn">All Orders</button>
                <button onclick="filterOrders('new')" class="update-status-btn">New</button>
                <button onclick="filterOrders('preparing')" class="update-status-btn">Preparing</button>
                <button onclick="filterOrders('out_for_delivery')" class="update-status-btn">Out for Delivery</button>
                <button onclick="filterOrders('delivered')" class="update-status-btn">Delivered</button>
            </div>

            <!-- Orders List -->
            <div id="orders-list"></div>

        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script>
        const ADMIN_PASSWORD = "admin123";
        let allOrders = [];
        let currentFilter = 'all';

        function adminLogin() {
            const password = document.getElementById('admin-password').value;
            if (password === ADMIN_PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadOrders();
            } else {
                alert('Wrong password!');
            }
        }

        function adminLogout() {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('admin-password').value = '';
        }

        async function loadOrders() {
            try {
                const snapshot = await db.collection('orders')
                    .orderBy('createdAt', 'desc')
                    .get();

                allOrders = [];
                snapshot.forEach(doc => {
                    allOrders.push({ id: doc.id, ...doc.data() });
                });

                updateStats();
                renderOrders(allOrders);

            } catch (error) {
                console.error('Error loading orders:', error);
            }
        }

        function updateStats() {
            document.getElementById('stat-new').textContent =
                allOrders.filter(o => o.status === 'new').length;
            document.getElementById('stat-preparing').textContent =
                allOrders.filter(o => o.status === 'preparing').length;
            document.getElementById('stat-delivery').textContent =
                allOrders.filter(o => o.status === 'out_for_delivery').length;
            document.getElementById('stat-delivered').textContent =
                allOrders.filter(o => o.status === 'delivered').length;
            document.getElementById('orders-count').textContent =
                `Total Orders: ${allOrders.length}`;
        }

        function filterOrders(filter) {
            currentFilter = filter;
            const filtered = filter === 'all' ?
                allOrders :
                allOrders.filter(o => o.status === filter);
            renderOrders(filtered);
        }

        function renderOrders(orders) {
            const list = document.getElementById('orders-list');

            if (orders.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#6B4C3B; font-size:18px; padding:40px;">No orders found.</p>';
                return;
            }

            list.innerHTML = orders.map(order => `
                <div class="order-card">
                    <div style="display:flex; justify-content:space-between; align-items:start; flex-wrap:wrap; gap:10px;">
                        <div>
                            <h3>Order #${order.orderNumber}</h3>
                            <span class="status-badge status-${order.status === 'out_for_delivery' ? 'delivery' : order.status}">
                                ${getStatusLabel(order.status)}
                            </span>
                        </div>
                        <div style="text-align:right;">
                            <p style="font-size:20px; font-weight:bold; color:#8B2500;">$${order.total}</p>
                            <p style="font-size:13px; color:#6B4C3B;">${new Date(order.createdAt).toLocaleString()}</p>
                        </div>
                    </div>

                    <div style="margin:15px 0; padding:15px; background-color:#FFF8DC; border-radius:8px;">
                        <p><strong>👤 Customer:</strong> ${order.customerName}</p>
                        <p><strong>📞 Phone:</strong> ${order.customerPhone}</p>
                        <p><strong>📧 Email:</strong> ${order.customerEmail}</p>
                        <p><strong>📍 Address:</strong> ${order.deliveryAddress}, ${order.deliveryCity}, ${order.deliveryZip}</p>
                        ${order.deliveryNotes ? `<p><strong>🗺️ Delivery Notes:</strong> ${order.deliveryNotes}</p>` : ''}
                        <p><strong>💳 Payment:</strong> ${order.paymentMethod}</p>
                        ${order.orderNotes ? `<p><strong>📝 Order Notes:</strong> ${order.orderNotes}</p>` : ''}
                    </div>

                    <div style="margin-bottom:15px;">
                        <strong>🍔 Items:</strong>
                        ${order.items.map(item => `
                            <div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #F5EFE6;">
                                <span>${item.quantity}x ${item.name}</span>
                                <span>$${(item.price * item.quantity).toFixed(2)}</span>
                            </div>
                        `).join('')}
                    </div>

                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        ${order.status !== 'delivered' ? `
                            <select id="status-${order.id}"
                                style="padding:8px; border:2px solid #D4A017; border-radius:5px; background-color:#FFF8DC; font-size:14px;">
                                <option value="new" ${order.status === 'new' ? 'selected' : ''}>New</option>
                                <option value="preparing" ${order.status === 'preparing' ? 'selected' : ''}>Preparing</option>
                                <option value="out_for_delivery" ${order.status === 'out_for_delivery' ? 'selected' : ''}>Out for Delivery</option>
                                <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                            </select>
                            <button class="update-status-btn" onclick="updateStatus('${order.id}')">
                                Update Status
                            </button>
                        ` : ''}
                        <button class="update-status-btn" onclick="deleteOrder('${order.id}')"
                            style="background-color:#C62828;">
                            Delete Order
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getStatusLabel(status) {
            const labels = {
                'new': '🆕 New Order',
                'preparing': '👨‍🍳 Preparing',
                'out_for_delivery': '🚗 Out for Delivery',
                'delivered': '✅ Delivered'
            };
            return labels[status] || status;
        }

        async function updateStatus(orderId) {
            const newStatus = document.getElementById(`status-${orderId}`).value;
            try {
                await db.collection('orders').doc(orderId).update({
                    status: newStatus
                });
                alert('Status updated!');
                loadOrders();
            } catch (error) {
                alert('Error updating status.');
                console.error(error);
            }
        }

        async function deleteOrder(orderId) {
            if (confirm('Are you sure you want to delete this order?')) {
                try {
                    await db.collection('orders').doc(orderId).delete();
                    alert('Order deleted!');
                    loadOrders();
                } catch (error) {
                    alert('Error deleting order.');
                    console.error(error);
                }
            }
        }
    </script>
</body>
</html>
